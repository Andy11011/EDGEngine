name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      multiarch:
        description: Build and push multi-arch (amd64 + arm64) images to GHCR
        type: boolean
        default: false
      deploy:
        description: Deploy to the EC2 host after the images are promoted to ECR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # push images to GHCR
  id-token: write   # OIDC -> AWS role assumption for the CodeBuild trigger

env:
  DB_NAME: postgres
  DB_USER: user
  DB_PASSWORD: pass
  APP_PORT: 8000

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Build amd64 images. Runs on every push/PR/dispatch — this is the
  # ONLY place either image gets built. Everything downstream just pulls tags
  # from here, nothing rebuilds.
  # --------------------------------------------------------------------------
  build_amd64:
    name: Build amd64 images
    #if: false  # TEMP: all jobs disabled — remove this line to re-enable
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: edge-scanner
            dockerfile: docker/Dockerfile.scanner
          - image_name: binance-virtual-mainnet-node
            dockerfile: docker/Dockerfile.binance_virtual_mainnet
          - image_name: binance-real-node
            dockerfile: docker/Dockerfile.binance_real
          - image_name: edge-point
            dockerfile: docker/Dockerfile.api
    outputs:
      owner_lc: ${{ steps.prep.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          TAG_ARGS="-t ${FULL_IMAGE_NAME}:${{ github.sha }}"

          # Only move :latest on real pushes to main — PRs and develop builds
          # still get a sha tag (which is what the test job pulls) but must
          # never clobber the production :latest tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_ARGS="$TAG_ARGS -t ${FULL_IMAGE_NAME}:latest"
          fi

          echo "Building amd64 image: ${FULL_IMAGE_NAME}"
          docker build -f "${{ matrix.dockerfile }}" $TAG_ARGS .

      - name: Push amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          docker push "${FULL_IMAGE_NAME}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "${FULL_IMAGE_NAME}:latest"
          fi

  # --------------------------------------------------------------------------
  # Stage 2: Run the health-check integration test on CodeBuild in
  # ap-southeast-1, pulling the exact edge-trader:<sha> image built above.
  # No second build happens here.
  # --------------------------------------------------------------------------
  smoke_tests:
    name: Run Smoke tests (CodeBuild, ap-southeast-1)
    #if: false  # TEMP: all jobs disabled — remove this line to re-enable
    needs: build_amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-codebuild-trigger
          aws-region: ap-southeast-1

      - name: Trigger CodeBuild
        uses: aws-actions/aws-codebuild-run-build@v1
        env:
          OWNER_LC: ${{ needs.build_amd64.outputs.owner_lc }}
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: ${{ env.APP_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SQS_TRADE_EVENTS_QUEUE_URL_VIRTUAL: ${{ vars.SQS_TRADE_EVENTS_QUEUE_URL_VIRTUAL }}
          SQS_TRADE_EVENTS_QUEUE_URL_REAL: ${{ vars.SQS_TRADE_EVENTS_QUEUE_URL_REAL }}
          SNS_TRADE_EVENTS_TOPIC_ARN: ${{ vars.SNS_TRADE_EVENTS_TOPIC_ARN }}
        with:
          project-name: edgetrader-integration-tests
          buildspec-override: .github/codebuild/buildspec.yml
          env-vars-for-codebuild: OWNER_LC,IMAGE_TAG,APP_PORT,DB_NAME,DB_USER,DB_PASSWORD,AWS_REGION,SQS_TRADE_EVENTS_QUEUE_URL_VIRTUAL,SQS_TRADE_EVENTS_QUEUE_URL_REAL,SNS_TRADE_EVENTS_TOPIC_ARN

  # --------------------------------------------------------------------------
  # Stage 3: Multi-arch images, only on manual workflow_dispatch — unchanged.
  # --------------------------------------------------------------------------
  docker_img_multiarch:
    name: Build multi‑arch images
    runs-on: ubuntu-latest
    needs: build_amd64
    if: github.event_name == 'workflow_dispatch' && inputs.multiarch
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: edge-scanner
            dockerfile: docker/Dockerfile.scanner
          - image_name: binance-virtual-mainnet-node
            dockerfile: docker/Dockerfile.binance_virtual_mainnet
          - image_name: binance-real-node
            dockerfile: docker/Dockerfile.binance_real
          - image_name: edge-point
            dockerfile: docker/Dockerfile.api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi‑arch image (${{ matrix.image_name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:${{ github.sha }}

  # --------------------------------------------------------------------------
  # Stage 4: Push images to the AWS ECR registry.
  # --------------------------------------------------------------------------

  promote_to_ecr:
    name: Promote to ECR (${{ matrix.image_name }})
    needs: [build_amd64, smoke_tests]
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # pull from GHCR
      id-token: write    # OIDC -> ECR push role
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - edge-scanner
          - binance-virtual-mainnet-node
          - binance-real-node
          - edge-point
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-ecr-push
          aws-region: ap-southeast-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMMUTABLE tags: a re-run for the same commit would fail at push,
      # so skip if the tag is already there.
      - name: Check if already promoted
        id: exists
        run: |
          if aws ecr describe-images \
              --repository-name "edgetrader/${{ matrix.image_name }}" \
              --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # The SHA tag is pushed only if it isn't there yet. :latest is moved on
      # every run (the ECR repo allows :latest to be overwritten), so a re-run
      # of the same commit still ends with :latest pointing at it.
      - name: Retag and push
        run: |
          set -e
          SRC="ghcr.io/${{ needs.build_amd64.outputs.owner_lc }}/${{ matrix.image_name }}:${{ github.sha }}"
          REPO="${{ steps.ecr.outputs.registry }}/edgetrader/${{ matrix.image_name }}"
          docker pull "$SRC"
          docker tag "$SRC" "$REPO:${{ github.sha }}"
          docker tag "$SRC" "$REPO:latest"
          if [ "${{ steps.exists.outputs.exists }}" != "true" ]; then
            docker push "$REPO:${{ github.sha }}"
          fi
          docker push "$REPO:latest"


  # --------------------------------------------------------------------------
  # Stage 5: Roll the promoted commit out to the EC2 host with SSM Run Command.
  # MANUAL ONLY: runs when the workflow is started by hand (Actions > CI > Run
  # workflow) on main with the "deploy" box ticked, after every image has been
  # promoted to ECR. Pushes and PRs never deploy. The host pulls the exact
  # commit SHA (not :latest), so it runs what the tests passed.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2 (SSM Run Command)
    needs: promote_to_ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write    # OIDC -> deploy role
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-deploy
          aws-region: ap-southeast-1

      - name: Run edgetrader-deploy on the host
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"

          CMD_ID=$(aws ssm send-command \
            --document-name edgetrader-deploy \
            --targets "Key=tag:Name,Values=EdgeTrader-Server" \
            --parameters "BinanceRealNodeTag=$SHA,BinanceVirtualMainnetNodeTag=$SHA,EdgePointTag=$SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=None
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            if [ "$STATUS" = "None" ] && [ "$i" -ge 6 ]; then
              echo "No instance received the command (is the host registered in SSM and tagged Name=EdgeTrader-Server?)"
              exit 1
            fi
          done

          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
            --query 'CommandInvocations[0].InstanceId' --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          [ "$STATUS" = "Success" ]
