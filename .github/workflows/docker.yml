name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      smoke_and_deploy_edgenode:
        description: Run Smoke tests and deploy EdgeNode (smoke tests run first; the deploy happens only if they pass)
        type: boolean
        default: false
      smoke_tests:
        description: Run the CodeBuild smoke tests after the images are promoted to ECR (a failure blocks the deploys)
        type: boolean
        default: false
      deploy:
        description: Deploy EdgeTrader (binance nodes + edge-point) to its EC2 host after the images are promoted to ECR
        type: boolean
        default: false
      deploy_scanner:
        description: Deploy EdgeScanner (edge-scanner + scannerL1) to its EC2 host after the images are promoted to ECR
        type: boolean
        default: false
      scanner_l1_tag:
        description: ECR tag of edgetrader/scanner-l1 (built by GitLab) to run on the scanner host. Used only with "deploy_scanner".
        type: string
        default: latest

permissions:
  contents: read
  packages: write   # push images to GHCR
  id-token: write   # OIDC -> AWS role assumption for the CodeBuild trigger

env:
  DB_NAME: postgres
  DB_USER: user
  DB_PASSWORD: pass
  APP_PORT: 8000

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Build amd64 images. Runs on every push/PR/dispatch — this is the
  # ONLY place either image gets built. Everything downstream just pulls tags
  # from here, nothing rebuilds.
  # --------------------------------------------------------------------------
  build_amd64:
    name: Build amd64 images
    #if: false  # TEMP: all jobs disabled — remove this line to re-enable
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: edge-scanner
            dockerfile: docker/Dockerfile.scanner
          - image_name: binance-virtual-mainnet-node
            dockerfile: docker/Dockerfile.binance_virtual_mainnet
          - image_name: binance-real-node
            dockerfile: docker/Dockerfile.binance_real
          - image_name: edge-point
            dockerfile: docker/Dockerfile.api
    outputs:
      owner_lc: ${{ steps.prep.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          TAG_ARGS="-t ${FULL_IMAGE_NAME}:${{ github.sha }}"

          # Only move :latest on real pushes to main — PRs and develop builds
          # still get a sha tag (which is what the test job pulls) but must
          # never clobber the production :latest tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_ARGS="$TAG_ARGS -t ${FULL_IMAGE_NAME}:latest"
          fi

          echo "Building amd64 image: ${FULL_IMAGE_NAME}"
          docker build -f "${{ matrix.dockerfile }}" $TAG_ARGS .

      - name: Push amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          docker push "${FULL_IMAGE_NAME}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "${FULL_IMAGE_NAME}:latest"
          fi

  # --------------------------------------------------------------------------
  # Stage 2: Push the images built above to the AWS ECR registry. Runs right
  # after the build on main (push or manual dispatch); smoke tests and deploys
  # come after this and use the images that are already in ECR.
  # --------------------------------------------------------------------------

  promote_to_ecr:
    name: Promote to ECR (${{ matrix.image_name }})
    needs: build_amd64
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # pull from GHCR
      id-token: write    # OIDC -> ECR push role
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - edge-scanner
          - binance-virtual-mainnet-node
          - binance-real-node
          - edge-point
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-ecr-push
          aws-region: ap-southeast-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMMUTABLE tags: a re-run for the same commit would fail at push,
      # so skip if the tag is already there.
      - name: Check if already promoted
        id: exists
        run: |
          if aws ecr describe-images \
              --repository-name "edgetrader/${{ matrix.image_name }}" \
              --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # The SHA tag is pushed only if it isn't there yet. :latest is moved on
      # every run (the ECR repo allows :latest to be overwritten), so a re-run
      # of the same commit still ends with :latest pointing at it.
      - name: Retag and push
        run: |
          set -e
          SRC="ghcr.io/${{ needs.build_amd64.outputs.owner_lc }}/${{ matrix.image_name }}:${{ github.sha }}"
          REPO="${{ steps.ecr.outputs.registry }}/edgetrader/${{ matrix.image_name }}"
          docker pull "$SRC"
          docker tag "$SRC" "$REPO:${{ github.sha }}"
          docker tag "$SRC" "$REPO:latest"
          if [ "${{ steps.exists.outputs.exists }}" != "true" ]; then
            docker push "$REPO:${{ github.sha }}"
          fi
          docker push "$REPO:latest"


  # --------------------------------------------------------------------------
  # Stage 3: Smoke test. Runs only when the workflow is started by hand with
  # "Run Smoke tests and deploy EdgeNode" ticked, after the images were
  # promoted to ECR. Runs the health-check integration test on CodeBuild in ap-southeast-1,
  # pulling the exact <image>:<sha> images built above. No second build.
  # If it fails, deploy_edgenode does not run.
  # --------------------------------------------------------------------------
  smoke_tests:
    name: Run Smoke tests (CodeBuild, ap-southeast-1)
    #if: false  # TEMP: all jobs disabled — remove this line to re-enable
    needs: [build_amd64, promote_to_ecr]
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_and_deploy_edgenode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-codebuild-trigger
          aws-region: ap-southeast-1

      - name: Trigger CodeBuild
        uses: aws-actions/aws-codebuild-run-build@v1
        env:
          OWNER_LC: ${{ needs.build_amd64.outputs.owner_lc }}
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: ${{ env.APP_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          project-name: edgetrader-integration-tests
          buildspec-override: .github/codebuild/buildspec.yml
          env-vars-for-codebuild: OWNER_LC,IMAGE_TAG,APP_PORT,DB_NAME,DB_USER,DB_PASSWORD,AWS_REGION

  # --------------------------------------------------------------------------
  # Stage 4: Roll the promoted commit out to the EdgeNode EC2 host (postgres +
  # edge-point + binance-virtual-mainnet-node + edge-scanner) with the SSM
  # document edgenode-virtual-deploy. MANUAL ONLY: runs after the smoke tests
  # passed, on main, when the workflow is started by hand with "Run Smoke tests
  # and deploy EdgeNode" ticked. Pushes and PRs never deploy. The host pulls the
  # exact commit SHA (not :latest), so it runs what the tests passed.
  # --------------------------------------------------------------------------
  deploy_edgenode:
    name: Deploy EdgeNode to EC2 (SSM Run Command)
    needs: [promote_to_ecr, smoke_tests]   # both must succeed (default success() rule)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.smoke_and_deploy_edgenode
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-edgenode
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write    # OIDC -> deploy role
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298724921728:role/github-actions-deploy-edgenode-virtual
          aws-region: ap-southeast-1

      - name: Run edgenode-virtual-deploy on the host
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"

          CMD_ID=$(aws ssm send-command \
            --document-name edgenode-virtual-deploy \
            --targets "Key=tag:Name,Values=EdgeNode-Virtual-Server" \
            --parameters "EdgePointTag=$SHA,BinanceVirtualNodeTag=$SHA,EdgeScannerTag=$SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=None
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            if [ "$STATUS" = "None" ] && [ "$i" -ge 6 ]; then
              echo "No instance received the command (is the host registered in SSM and tagged Name=EdgeNode-Virtual-Server?)"
              exit 1
            fi
          done

          INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
            --query 'CommandInvocations[0].InstanceId' --output text)
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          [ "$STATUS" = "Success" ]
