name: Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Build amd64 images (on push to main)
  # --------------------------------------------------------------------------
  docker_img_x86_64:
    name: Build amd64 images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: edge-scanner
            dockerfile: Dockerfile.scanner
          - image_name: edge-trader
            dockerfile: Dockerfile.trader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          echo "Building amd64 image: ${FULL_IMAGE_NAME}"

          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${FULL_IMAGE_NAME}:latest" \
            -t "${FULL_IMAGE_NAME}:${{ github.sha }}" \
            .

      - name: Push amd64 image (${{ matrix.image_name }})
        run: |
          set -e
          FULL_IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}"
          docker push "${FULL_IMAGE_NAME}:latest"
          docker push "${FULL_IMAGE_NAME}:${{ github.sha }}"

  # --------------------------------------------------------------------------
  # Stage 2: Build multi-arch images (only on manual workflow_dispatch)
  # --------------------------------------------------------------------------
  docker_img_multiarch:
    name: Build multi‑arch images
    runs-on: ubuntu-latest
    needs: docker_img_x86_64          # kept for consistency (optional)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: edge-scanner
            dockerfile: Dockerfile.scanner
          - image_name: edge-trader
            dockerfile: Dockerfile.trader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi‑arch image (${{ matrix.image_name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:${{ github.sha }}
