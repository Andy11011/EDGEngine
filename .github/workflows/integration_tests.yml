name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DB_NAME: postgres
  DB_USER: testuser
  DB_PASSWORD: testpass
  DB_HOST: postgres
  DB_PORT: 5432

jobs:
  health-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -f Dockerfile.trader -t edgetrader:ci .

      - name: Run EDGETrader container
        run: |
          docker run -d \
            --name edgetrader-ci \
            --network ${{ job.container.network }} \
            -e TRADING_MODE=VIRTUAL \
            -e BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }} \
            -e BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_REGION=${{ secrets.AWS_REGION }} \
            -e SQS_TRADE_EVENTS_QUEUE_URL=${{ secrets.SQS_TRADE_EVENTS_QUEUE_URL }} \
            -e DB_NAME=${{ env.DB_NAME }} \
            -e DB_USER=${{ env.DB_USER }} \
            -e DB_PASSWORD=${{ env.DB_PASSWORD }} \
            -e DB_HOST=${{ env.DB_HOST }} \
            -e DB_PORT=${{ env.DB_PORT }} \
            -p 8000:8000 \
            edgetrader:ci

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Run health test
        run: pytest -v tests/test_health.py