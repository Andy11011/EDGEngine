name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DB_NAME: postgres
  DB_USER: user
  DB_PASSWORD: pass
  DB_HOST: localhost
  DB_PORT: 5432

jobs:
  health-check:
    runs-on: self-hosted
    # NOTE: no `services:` block here — GitHub Actions' service containers require a
    # Linux runner OS and will fail with "Container operations are only supported on
    # Linux runners" on Windows, even self-hosted. This job instead relies on Postgres
    # running natively on the Windows host (see setup notes below).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify native Postgres is reachable
        run: |
          pip install psycopg2-binary
          python -c "
          import psycopg2, os
          psycopg2.connect(
              dbname=os.environ['DB_NAME'],
              user=os.environ['DB_USER'],
              password=os.environ['DB_PASSWORD'],
              host=os.environ['DB_HOST'],
              port=os.environ['DB_PORT'],
          )
          print('Connected to native Postgres OK')
          "

      - name: Build app image
        run: docker build -f Dockerfile.trader -t edgetrader:ci .

      - name: Run EDGETrader container
        # NOTE: --network host is dropped because Docker Desktop on Windows does not
        # reliably support Linux host networking. The container instead talks to your
        # native Windows Postgres via host.docker.internal, and its app port is published
        # with -p so pytest (running natively on the runner) can reach it over localhost.
        # TODO: replace <APP_PORT> below with whatever port Dockerfile.trader actually
        # exposes (check the Dockerfile's EXPOSE line / your app's listen port).
        run: |
          docker run -d \
            --name edgetrader-ci \
            -p 5432:5432 \
            -e TRADING_MODE=VIRTUAL \
            -e BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }} \
            -e BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }} \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_REGION=${{ vars.AWS_REGION }} \
            -e SQS_TRADE_EVENTS_QUEUE_URL=${{ vars.SQS_TRADE_EVENTS_QUEUE_URL }} \
            -e DB_NAME=${{ vars.DB_NAME }} \
            -e DB_USER=${{ vars.DB_USER }} \
            -e DB_PASSWORD=${{ vars.DB_PASSWORD }} \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=${{ vars.DB_PORT }} \
            -e TRADING_MODE=TESTNET \
            -e BINANCE_SANDBOX_API_KEY=${{ secrets.BINANCE_SANDBOX_API_KEY }} \
            -e BINANCE_SANDBOX_API_SECRET=${{ secrets.BINANCE_SANDBOX_API_SECRET }} \
            edgetrader:ci

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Run health test
        run: pytest -v tests/test_health.py

      - name: Dump container state on failure
        if: always()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- edgetrader-ci logs ---"
          docker logs edgetrader-ci || true
          echo "--- edgetrader-ci inspect (network) ---"
          docker inspect edgetrader-ci --format '{{json .NetworkSettings.Networks}}' || true
