include classpath("application.conf")

# Queue URLs are built from the Host header of each request, so the same
# server answers as http://sqs-ci:9324 (nodes, over the docker network) and
# http://localhost:9324 (pytest on the CodeBuild host).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  trade-events-virtual {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
  scanner-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
}
